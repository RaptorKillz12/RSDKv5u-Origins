name: Build Origins-Compatible Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      # CHECKOUT ORIGINS ENGINE
      - name: Checkout Origins-compatible RSDK engine
        uses: actions/checkout@v5
        with:
          repository: thesupersonic16/RSDKv5u-Origins
          ref: master
          submodules: recursive
          path: engine

      # CHECKOUT GAME SOURCE
      - name: Checkout Sonic Mania source
        uses: actions/checkout@v5
        with:
          repository: RSDKModding/Sonic-Mania-Decompilation
          submodules: recursive
          path: Sonic-Mania-Decompilation

      # JAVA
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: engine/android/**/*.gradle*

      - name: Verify Java
        run: |
          java -version
          javac -version

      # ANDROID SDK SETUP
      # Continue if the setup action fails; the next step installs tools.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"

          echo "Using Android SDK: $SDK"
          mkdir -p "$SDK/cmdline-tools"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          sudo apt-get update
          sudo apt-get install -y curl unzip

          curl -fL \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o /tmp/android-commandline-tools.zip

          mkdir -p /tmp/android-tools
          unzip -q /tmp/android-commandline-tools.zip \
            -d /tmp/android-tools

          rm -rf "$SDK/cmdline-tools/latest"
          mkdir -p "$SDK/cmdline-tools/latest"

          mv /tmp/android-tools/cmdline-tools/* \
            "$SDK/cmdline-tools/latest/"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" --licenses || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

          echo "Android SDK installation complete."

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          "$ANDROID_SDK_ROOT/platform-tools/adb" version
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_SDK_ROOT" --list_installed

      # LINUX DEPENDENCIES
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip rsync

      # OGG AND THEORA DEPENDENCIES
      - name: Install Android OGG and Theora dependencies
        working-directory: engine/dependencies/android
        shell: bash
        run: |
          set -euo pipefail

          curl -fL \
            https://downloads.xiph.org/releases/ogg/libogg-1.3.5.zip \
            -o libogg.zip

          curl -fL \
            https://downloads.xiph.org/releases/theora/libtheora-1.1.1.zip \
            -o libtheora.zip

          unzip -q libogg.zip
          unzip -q libtheora.zip

          rm -rf libogg libtheora
          mkdir -p libogg
          rsync -a libogg-1.3.5/ libogg/
          mv libtheora-1.1.1 libtheora

          rm -f libogg.zip libtheora.zip

      # JNI SOURCE LINKS
      - name: Configure Android source links
        shell: bash
        run: |
          set -euo pipefail

          JNI="$GITHUB_WORKSPACE/engine/android/app/jni"

          test -f "$JNI/CMakeLists.txt"
          test -f engine/android/app/build.gradle
          test -f engine/android/gradlew

          rm -rf "$JNI/RSDKv5" "$JNI/Game"

          ln -s "$GITHUB_WORKSPACE/engine" \
            "$JNI/RSDKv5"

          ln -s "$GITHUB_WORKSPACE/Sonic-Mania-Decompilation" \
            "$JNI/Game"

          echo "Configured JNI source links:"
          ls -la "$JNI"

      # GRADLE
      - name: Prepare Gradle
        working-directory: engine/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --version

      # BUILD REVISION 3
      - name: Build RSDKv5U Android
        working-directory: engine/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assemble \
            --no-daemon \
            --stacktrace \
            -PABIFILTERS="armeabi-v7a;arm64-v8a" \
            -PRETRO_DISABLE_PLUS \
            -PRETRO_REVISION=3

      - name: Collect RSDKv5U APK
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/v5u

          if [ -d engine/android/app/build/outputs ]; then
            find engine/android/app/build/outputs \
              -type f -name '*.apk' \
              -exec cp -t artifacts/v5u/ {} + \
              2>/dev/null || true
          fi

          ls -lh artifacts/v5u || true

      # BUILD REVISION 2
      - name: Build RSDKv5 Android
        working-directory: engine/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean --no-daemon

          ./gradlew assemble \
            --no-daemon \
            --stacktrace \
            -PABIFILTERS="armeabi-v7a;arm64-v8a" \
            -PRETRO_DISABLE_PLUS \
            -PRETRO_REVISION=2

      - name: Collect RSDKv5 APK
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/v5

          if [ -d engine/android/app/build/outputs ]; then
            find engine/android/app/build/outputs \
              -type f -name '*.apk' \
              -exec cp -t artifacts/v5/ {} + \
              2>/dev/null || true
          fi

          ls -lh artifacts/v5 || true

      # UPLOAD APK ARTIFACTS
      - name: Upload Android APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: origins-compatible-android
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
