
name: Build Origins-Compatible Android Engine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Origins-compatible RSDK engine
        uses: actions/checkout@v5
        with:
          repository: thesupersonic16/RSDKv5u-Origins
          ref: master
          submodules: recursive
          path: engine

      - name: Checkout Sonic Mania game source
        uses: actions/checkout@v5
        with:
          repository: RSDKModding/Sonic-Mania-Decompilation
          submodules: recursive
          path: Sonic-Mania-Decompilation

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Linux tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip rsync

      - name: Download Android OGG and Theora dependencies
        working-directory: engine/dependencies/android
        run: |
          set -euo pipefail

          curl -fL \
            https://downloads.xiph.org/releases/ogg/libogg-1.3.5.zip \
            -o libogg.zip

          curl -fL \
            https://downloads.xiph.org/releases/theora/libtheora-1.1.1.zip \
            -o libtheora.zip

          unzip -q libogg.zip
          unzip -q libtheora.zip

          rm -rf libogg libtheora
          mkdir libogg
          rsync -a libogg-1.3.5/ libogg/
          mv libtheora-1.1.1 libtheora

      - name: Configure Android source links
        run: |
          set -euo pipefail

          mkdir -p engine/android/app/jni

          rm -rf \
            engine/android/app/jni/RSDKv5 \
            engine/android/app/jni/Game

          ln -s \
            "$GITHUB_WORKSPACE/engine" \
            engine/android/app/jni/RSDKv5

          ln -s \
            "$GITHUB_WORKSPACE/Sonic-Mania-Decompilation" \
            engine/android/app/jni/Game

          echo "JNI source links:"
          ls -la engine/android/app/jni

      - name: Verify Android project
        run: |
          set -euo pipefail

          test -f engine/android/gradlew
          test -f engine/android/app/build.gradle
          test -f engine/android/app/jni/CMakeLists.txt

          chmod +x engine/android/gradlew

      - name: Build RSDKv5U Android
        working-directory: engine/android
        run: |
          set -euo pipefail

          ./gradlew assemble \
            --no-daemon \
            --stacktrace \
            -PABIFILTERS="arm64-v8a;armeabi-v7a" \
            -PRETRO_DISABLE_PLUS \
            -PRETRO_REVISION=3

      - name: Save RSDKv5U APKs
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/v5u"

          find engine/android/app/build/outputs \
            -type f -name '*.apk' \
            -exec cp {} "$GITHUB_WORKSPACE/artifacts/v5u/" \; \
            2>/dev/null || true

      - name: Build RSDKv5 Android
        working-directory: engine/android
        run: |
          set -euo pipefail

          ./gradlew clean --no-daemon

          ./gradlew assemble \
            --no-daemon \
            --stacktrace \
            -PABIFILTERS="arm64-v8a;armeabi-v7a" \
            -PRETRO_DISABLE_PLUS \
            -PRETRO_REVISION=2

      - name: Save RSDKv5 APKs
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/v5"

          find engine/android/app/build/outputs \
            -type f -name '*.apk' \
            -exec cp {} "$GITHUB_WORKSPACE/artifacts/v5/" \; \
            2>/dev/null || true

      - name: Upload Android APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: origins-compatible-android-engine
          path: artifacts/
          if-no-files-found: warn
