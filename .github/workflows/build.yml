name: Build RSDKv5

on:
  workflow_dispatch:

# ============================================================
# RSDKv5 / RSDKv5U
#
# RSDK_REVISION=2 -> RSDKv5
# RSDK_REVISION=3 -> RSDKv5U
#
# Android builds both ARMv7 and ARM64.
# ============================================================

jobs:

  # ==========================================================
  # WINDOWS 32-BIT
  # ==========================================================

  v5-windows:
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            pkg-config
            make
            git
            mingw-w64-i686-gcc
            mingw-w64-i686-libogg
            mingw-w64-i686-libtheora

      - name: Build RSDKv5
        run: |
          make -j8 RSDK_ONLY=1 AUTOBUILD=1

      - name: Build RSDKv5U
        run: |
          make -j8 clean-rsdk
          make -j8 RSDK_ONLY=1 RSDK_REVISION=3 AUTOBUILD=1

      - name: Move artifacts
        run: |
          mkdir -p artifacts
          cp ./bin/Windows/DX9/*.exe ./artifacts/

      - name: List artifacts
        run: |
          ls -lah artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v5-windows
          path: artifacts


  # ==========================================================
  # WINDOWS 64-BIT
  # ==========================================================

  v5-windows-x64:
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            pkg-config
            make
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-libtheora

      - name: Build RSDKv5
        run: |
          make -j8 RSDK_ONLY=1 AUTOBUILD=1

      - name: Build RSDKv5U
        run: |
          make -j8 clean-rsdk
          make -j8 RSDK_ONLY=1 RSDK_REVISION=3 AUTOBUILD=1

      - name: Move artifacts
        run: |
          mkdir -p artifacts
          cp ./bin/Windows/DX9/*.exe ./artifacts/

      - name: List artifacts
        run: |
          ls -lah artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v5-windows-x64
          path: artifacts


  # ==========================================================
  # LINUX
  # ==========================================================

  v5-linux:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            make \
            git \
            libogg-dev \
            libsdl2-dev \
            libtheora-dev \
            libglew-dev \
            libglfw3-dev

      # ------------------------------------------------------
      # OpenGL RSDKv5 + RSDKv5U
      # ------------------------------------------------------

      - name: Build RSDKv5 + U OGL
        run: |
          make -j$(nproc) RSDK_ONLY=1 AUTOBUILD=1

          make -j$(nproc) clean-rsdk

          make -j$(nproc) \
            RSDK_ONLY=1 \
            RSDK_REVISION=3 \
            AUTOBUILD=1

      # ------------------------------------------------------
      # SDL2 RSDKv5 + RSDKv5U
      # ------------------------------------------------------

      - name: Build RSDKv5 + U SDL2
        run: |
          make -j$(nproc) \
            RSDK_ONLY=1 \
            SUBSYSTEM=SDL2 \
            AUTOBUILD=1

          make -j$(nproc) clean-rsdk

          make -j$(nproc) \
            RSDK_ONLY=1 \
            SUBSYSTEM=SDL2 \
            RSDK_REVISION=3 \
            AUTOBUILD=1

      - name: List Linux artifacts
        run: |
          find bin/Linux -maxdepth 2 -type f -print || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v5-linux
          path: bin/Linux


  # ==========================================================
  # ANDROID
  # ==========================================================

  v5-android:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout RSDKv5
      # ------------------------------------------------------

      - name: Checkout RSDKv5
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ------------------------------------------------------
      # Checkout Sonic Mania
      #
      # The Android project needs a Game source tree.
      # ------------------------------------------------------

      - name: Checkout Sonic Mania
        uses: actions/checkout@v4
        with:
          repository: RSDKModding/Sonic-Mania-Decompilation
          path: Sonic-Mania-Decompilation
          submodules: recursive

      # ------------------------------------------------------
      # Checkout GameAPI
      # ------------------------------------------------------

      - name: Checkout GameAPI
        uses: actions/checkout@v4
        with:
          repository: RSDKModding/RSDKv5-GameAPI
          path: RSDKv5-GameAPI

      # ------------------------------------------------------
      # Checkout Example Mods
      # ------------------------------------------------------

      - name: Checkout Example Mods
        uses: actions/checkout@v4
        with:
          repository: RSDKModding/RSDKv5-Example-Mods
          path: RSDKv5-Example-Mods

      # ------------------------------------------------------
      # Download Android dependencies
      # ------------------------------------------------------

      - name: Setup Android dependencies
        working-directory: ./dependencies/android
        run: |
          set -e

          curl -L \
            -o libogg.zip \
            https://downloads.xiph.org/releases/ogg/libogg-1.3.5.zip

          curl -L \
            -o libtheora.zip \
            https://downloads.xiph.org/releases/theora/libtheora-1.1.1.zip

          unzip -q libogg.zip
          unzip -q libtheora.zip

          rm -f libogg.zip
          rm -f libtheora.zip

          rm -rf libogg
          mkdir -p libogg

          rsync -a libogg-1.3.5/ libogg/

          rm -rf libtheora

          mv libtheora-1.1.1 libtheora

      # ------------------------------------------------------
      # Setup Android source links
      # ------------------------------------------------------

      - name: Setup Android source tree
        run: |
          set -e

          echo "Setting up RSDKv5 link..."

          rm -rf Sonic-Mania-Decompilation/dependencies/RSDKv5

          ln -s \
            "$GITHUB_WORKSPACE" \
            Sonic-Mania-Decompilation/dependencies/RSDKv5

          echo "Setting up GameAPI links..."

          mkdir -p RSDKv5-Example-Mods/ManiaTouchControls
          mkdir -p RSDKv5-Example-Mods/UltrawideMania

          rm -f \
            RSDKv5-Example-Mods/ManiaTouchControls/GameAPI

          rm -f \
            RSDKv5-Example-Mods/UltrawideMania/GameAPI

          ln -s \
            "$GITHUB_WORKSPACE/RSDKv5-GameAPI" \
            RSDKv5-Example-Mods/ManiaTouchControls/GameAPI

          ln -s \
            "$GITHUB_WORKSPACE/RSDKv5-GameAPI" \
            RSDKv5-Example-Mods/UltrawideMania/GameAPI

          echo "Setting up Android Game link..."

          rm -f android/app/jni/Game

          ln -s \
            "$GITHUB_WORKSPACE/Sonic-Mania-Decompilation" \
            android/app/jni/Game

          echo "Setting up MTC link..."

          rm -f android/app/jni/MTC

          ln -s \
            "$GITHUB_WORKSPACE/RSDKv5-Example-Mods/ManiaTouchControls" \
            android/app/jni/MTC

          echo "Setting up UWM link..."

          rm -f android/app/jni/UWM

          ln -s \
            "$GITHUB_WORKSPACE/RSDKv5-Example-Mods/UltrawideMania" \
            android/app/jni/UWM

          echo "Android links:"
          ls -la android/app/jni/

      # ------------------------------------------------------
      # Java
      # ------------------------------------------------------

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      # ------------------------------------------------------
      # Android SDK
      # ------------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ------------------------------------------------------
      # Build RSDKv5U Android
      #
      # RETRO_REVISION=3
      # ------------------------------------------------------

      - name: Build RSDKv5U Android
        working-directory: ./android
        run: |
          chmod +x gradlew

          ./gradlew assemble \
            --no-daemon \
            -PABIFILTERS="armeabi-v7a;arm64-v8a" \
            -PRETRO_DISABLE_PLUS \
            -PRETRO_REVISION=3

          mkdir -p ../android-artifacts

          cp \
            app/build/outputs/apk/release/*.apk \
            ../android-artifacts/rsdkv5u_mania.apk

      # ------------------------------------------------------
      # Build RSDKv5 Android
      #
      # RETRO_REVISION=2
      # ------------------------------------------------------

      - name: Build RSDKv5 Android
        working-directory: ./android
        run: |
          ./gradlew clean --no-daemon

          ./gradlew assemble \
            --no-daemon \
            -PABIFILTERS="armeabi-v7a;arm64-v8a" \
            -PRETRO_DISABLE_PLUS \
            -PRETRO_REVISION=2

          cp \
            app/build/outputs/apk/release/*.apk \
            ../android-artifacts/rsdkv5_mania.apk

      # ------------------------------------------------------
      # Show APK information
      # ------------------------------------------------------

      - name: List Android artifacts
        run: |
          echo "Android builds:"

          ls -lh android-artifacts/

          echo ""
          echo "APK information:"

          file android-artifacts/*.apk

      # ------------------------------------------------------
      # Cleanup symlinks
      # ------------------------------------------------------

      - name: Cleanup
        if: always()
        run: |
          rm -f \
            Sonic-Mania-Decompilation/dependencies/RSDKv5

          rm -f \
            android/app/jni/Game

          rm -f \
            android/app/jni/MTC

          rm -f \
            android/app/jni/UWM

      # ------------------------------------------------------
      # Upload Android APKs
      # ------------------------------------------------------

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v5-android
          path: android-artifacts          mkdir artifacts
          mv ./bin/Windows/DX9/*.exe ./artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v1.0.0
        with:
          name: v5-windows
          path: artifacts
  v5-windows-x64:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout 
        uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: pkg-config make git mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2 mingw-w64-x86_64-libogg mingw-w64-x86_64-libtheora
      - name: Build RSDKv5 + U
        run: |
          make -j8 RSDK_ONLY=1 AUTOBUILD=1
          make -j8 clean-rsdk
          make -j8 RSDK_ONLY=1 RSDK_REVISION=3 AUTOBUILD=1
      - name: Move artifacts
        run: |
          mkdir artifacts
          mv ./bin/Windows/DX9/*.exe ./artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v1.0.0
        with:
          name: v5-windows-x64
          path: artifacts
  v5-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libogg-dev libsdl2-dev libtheora-dev libglew-dev libglfw3-dev
      - name: Build RSDKv5 + U OGL
        run: |
          make -j8 RSDK_ONLY=1 AUTOBUILD=1
          make -j8 clean-rsdk
          make -j8 RSDK_ONLY=1 RSDK_REVISION=3 AUTOBUILD=1
      - name: Build RSDKv5 + U SDL2
        run: |
          make -j8 RSDK_ONLY=1 SUBSYSTEM=SDL2 AUTOBUILD=1
          make -j8 clean-rsdk
          make -j8 RSDK_ONLY=1 SUBSYSTEM=SDL2 RSDK_REVISION=3 AUTOBUILD=1
      - name: Upload artifacts
        uses: actions/upload-artifact@v1.0.0
        with:
          name: v5-linux
          path: bin/Linux
