name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # Allows you to manually trigger the build

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repo along with all submodules (CRITICAL)
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    # Step 2: Configure Java environment required by Gradle
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Step 3: Automatically accept SDK licenses and install NDK
    - name: Setup Android SDK & NDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

    # Step 4: Create the directory symbolic links inside the Linux environment
    - name: Create Engine Symlinks
      run: |
        cd dependencies/android/app/jni
        ln -s ../../../../RSDKv5 RSDKv5
        ln -s ../../../../Game Game

    # Step 5: Make gradlew executable and build the application
    - name: Build with Gradle
      run: |
        cd dependencies/android
        chmod +x gradlew
        ./gradlew assembleDebug

    # Step 6: Upload the successfully built APK as an artifact
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rsdkv5u-android-debug-apk
        path: dependencies/android/app/build/outputs/apk/debug/app-debug.apk
