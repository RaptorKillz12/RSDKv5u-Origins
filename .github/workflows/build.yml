name: Build RSDKv5

on:
  workflow_dispatch:

jobs:

  # ============================================================
  # RSDKv5 / RSDKv5U - Windows 32-bit
  # ============================================================

  v5-windows:
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            pkg-config
            make
            git
            mingw-w64-i686-gcc
            mingw-w64-i686-libogg
            mingw-w64-i686-libtheora

      - name: Build RSDKv5 + RSDKv5U
        run: |
          set -e

          make -j8 RSDK_ONLY=1 AUTOBUILD=1

          make -j8 clean-rsdk

          make -j8 RSDK_ONLY=1 RSDK_REVISION=3 AUTOBUILD=1

      - name: Move artifacts
        run: |
          mkdir -p artifacts

          find ./bin/Windows/DX9 -name "*.exe" -type f -exec cp {} ./artifacts/ \;

          echo "Windows 32-bit artifacts:"
          ls -lh artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v5-windows
          path: artifacts


  # ============================================================
  # RSDKv5 / RSDKv5U - Windows 64-bit
  # ============================================================

  v5-windows-x64:
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            pkg-config
            make
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-libtheora

      - name: Build RSDKv5 + RSDKv5U
        run: |
          set -e

          make -j8 RSDK_ONLY=1 AUTOBUILD=1

          make -j8 clean-rsdk

          make -j8 RSDK_ONLY=1 RSDK_REVISION=3 AUTOBUILD=1

      - name: Move artifacts
        run: |
          mkdir -p artifacts

          find ./bin/Windows/DX9 -name "*.exe" -type f -exec cp {} ./artifacts/ \;

          echo "Windows 64-bit artifacts:"
          ls -lh artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v5-windows-x64
          path: artifacts


  # ============================================================
  # RSDKv5 / RSDKv5U - Linux
  # ============================================================

  v5-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            git \
            libogg-dev \
            libsdl2-dev \
            libtheora-dev \
            libglew-dev \
            libglfw3-dev

      - name: Build RSDKv5 + RSDKv5U OpenGL
        run: |
          set -e

          make -j8 RSDK_ONLY=1 AUTOBUILD=1

          make -j8 clean-rsdk

          make -j8 RSDK_ONLY=1 RSDK_REVISION=3 AUTOBUILD=1

      - name: Build RSDKv5 + RSDKv5U SDL2
        run: |
          set -e

          make -j8 RSDK_ONLY=1 SUBSYSTEM=SDL2 AUTOBUILD=1

          make -j8 clean-rsdk

          make -j8 RSDK_ONLY=1 SUBSYSTEM=SDL2 RSDK_REVISION=3 AUTOBUILD=1

      - name: Show Linux artifacts
        run: |
          echo "Linux artifacts:"
          find bin/Linux -type f -maxdepth 3 -print || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v5-linux
          path: bin/Linux


  # ============================================================
  # Android
  #
  # Builds:
  #   RSDKv5U = RETRO_REVISION=3
  #   RSDKv5  = RETRO_REVISION=2
  #
  # ABIs:
  #   armeabi-v7a
  #   arm64-v8a
  # ============================================================

  v5-android:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # RSDKv5 source
      # ----------------------------------------------------------

      - name: Checkout RSDKv5
        uses: actions/checkout@v4
        with:
          submodules: recursive


      # ----------------------------------------------------------
      # Sonic Mania Android game source
      # ----------------------------------------------------------

      - name: Checkout Sonic Mania
        uses: actions/checkout@v4
        with:
          repository: RSDKModding/Sonic-Mania-Decompilation
          path: Sonic-Mania-Decompilation
          submodules: recursive


      # ----------------------------------------------------------
      # GameAPI
      # ----------------------------------------------------------

      - name: Checkout GameAPI
        uses: actions/checkout@v4
        with:
          repository: RSDKModding/RSDKv5-GameAPI
          path: RSDKv5-GameAPI


      # ----------------------------------------------------------
      # Example Android mods
      # ----------------------------------------------------------

      - name: Checkout Example Mods
        uses: actions/checkout@v4
        with:
          repository: RSDKModding/RSDKv5-Example-Mods
          path: RSDKv5-Example-Mods


      # ----------------------------------------------------------
      # Android audio dependencies
      # ----------------------------------------------------------

      - name: Setup Android dependencies
        working-directory: ./dependencies/android
        run: |
          set -e

          echo "Downloading libogg..."

          curl -L \
            -o libogg.zip \
            https://downloads.xiph.org/releases/ogg/libogg-1.3.5.zip

          echo "Downloading libtheora..."

          curl -L \
            -o libtheora.zip \
            https://downloads.xiph.org/releases/theora/libtheora-1.1.1.zip

          echo "Extracting libogg..."

          unzip -q libogg.zip

          echo "Extracting libtheora..."

          unzip -q libtheora.zip

          rm -f libogg.zip
          rm -f libtheora.zip

          rm -rf libogg
          mkdir -p libogg

          rsync -a \
            libogg-1.3.5/ \
            libogg/

          rm -rf libtheora

          mv \
            libtheora-1.1.1 \
            libtheora

          echo "Android dependencies:"
          ls -la


      # ----------------------------------------------------------
      # Connect RSDKv5 to the Android project
      # ----------------------------------------------------------

      - name: Setup Android source tree
        run: |
          set -e

          echo "Setting up RSDKv5 dependency..."

          rm -rf \
            Sonic-Mania-Decompilation/dependencies/RSDKv5

          ln -s \
            "$GITHUB_WORKSPACE" \
            Sonic-Mania-Decompilation/dependencies/RSDKv5


          echo "Setting up GameAPI mods..."

          rm -f \
            RSDKv5-Example-Mods/ManiaTouchControls/GameAPI

          rm -f \
            RSDKv5-Example-Mods/UltrawideMania/GameAPI


          ln -s \
            "$GITHUB_WORKSPACE/RSDKv5-GameAPI" \
            RSDKv5-Example-Mods/ManiaTouchControls/GameAPI

          ln -s \
            "$GITHUB_WORKSPACE/RSDKv5-GameAPI" \
            RSDKv5-Example-Mods/UltrawideMania/GameAPI


          echo "Setting up Android Game source..."

          rm -f \
            android/app/jni/Game

          ln -s \
            "$GITHUB_WORKSPACE/Sonic-Mania-Decompilation" \
            android/app/jni/Game


          echo "Setting up ManiaTouchControls..."

          rm -f \
            android/app/jni/MTC

          ln -s \
            "$GITHUB_WORKSPACE/RSDKv5-Example-Mods/ManiaTouchControls" \
            android/app/jni/MTC


          echo "Setting up UltrawideMania..."

          rm -f \
            android/app/jni/UWM

          ln -s \
            "$GITHUB_WORKSPACE/RSDKv5-Example-Mods/UltrawideMania" \
            android/app/jni/UWM


          echo ""
          echo "Android source tree:"
          ls -la android/app/jni/


      # ----------------------------------------------------------
      # Java
      # ----------------------------------------------------------

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle


      # ----------------------------------------------------------
      # Android SDK
      # ----------------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ----------------------------------------------------------
      # FIX FOR EXIT CODE 126
      #
      # GitHub checkout can leave gradlew without executable
      # permissions. chmod fixes:
      #
      #   ./gradlew: Permission denied
      #   exit code 126
      # ----------------------------------------------------------

      - name: Fix Gradle wrapper permissions
        working-directory: ./android
        run: |
          set -e

          echo "Before chmod:"
          ls -l gradlew

          chmod +x gradlew

          echo "After chmod:"
          ls -l gradlew

          echo "Gradle wrapper:"
          file gradlew


      # ----------------------------------------------------------
      # Test Gradle before compiling
      # ----------------------------------------------------------

      - name: Test Gradle wrapper
        working-directory: ./android
        run: |
          set -e

          ./gradlew --version


      # ----------------------------------------------------------
      # Build RSDKv5U
      #
      # RETRO_REVISION=3 = RSDKv5U
      # ----------------------------------------------------------

      - name: Build RSDKv5U Android
        working-directory: ./android
        run: |
          set -e

          echo "========================================"
          echo "Building RSDKv5U Android"
          echo "========================================"

          ./gradlew assemble \
            --no-daemon \
            -PABIFILTERS="armeabi-v7a;arm64-v8a" \
            -PRETRO_DISABLE_PLUS \
            -PRETRO_REVISION=3

          mkdir -p ../android-artifacts

          echo "Searching for APK..."

          APK=$(find \
            app/build/outputs/apk/release \
            -name "*.apk" \
            -type f \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: RSDKv5U APK was not produced."

            echo "Build output:"
            find app/build/outputs \
              -type f \
              -print \
              || true

            exit 1
          fi

          echo "Found:"
          echo "$APK"

          cp \
            "$APK" \
            ../android-artifacts/rsdkv5u_mania.apk


      # ----------------------------------------------------------
      # Build RSDKv5
      #
      # RETRO_REVISION=2 = RSDKv5
      # ----------------------------------------------------------

      - name: Build RSDKv5 Android
        working-directory: ./android
        run: |
          set -e

          echo "========================================"
          echo "Cleaning Android build"
          echo "========================================"

          ./gradlew clean \
            --no-daemon

          echo "========================================"
          echo "Building RSDKv5 Android"
          echo "========================================"

          ./gradlew assemble \
            --no-daemon \
            -PABIFILTERS="armeabi-v7a;arm64-v8a" \
            -PRETRO_DISABLE_PLUS \
            -PRETRO_REVISION=2

          echo "Searching for APK..."

          APK=$(find \
            app/build/outputs/apk/release \
            -name "*.apk" \
            -type f \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: RSDKv5 APK was not produced."

            echo "Build output:"
            find app/build/outputs \
              -type f \
              -print \
              || true

            exit 1
          fi

          echo "Found:"
          echo "$APK"

          cp \
            "$APK" \
            ../android-artifacts/rsdkv5_mania.apk


      # ----------------------------------------------------------
      # Show APKs
      # ----------------------------------------------------------

      - name: Show Android APKs
        if: always()
        run: |
          echo "========================================"
          echo "ANDROID APK OUTPUT"
          echo "========================================"

          if [ -d android-artifacts ]; then
            ls -lh android-artifacts/

            echo ""
            echo "File information:"

            file \
              android-artifacts/*.apk \
              || true
          else
            echo "android-artifacts directory does not exist."
          fi


      # ----------------------------------------------------------
      # Cleanup symlinks
      # ----------------------------------------------------------

      - name: Cleanup Android source tree
        if: always()
        run: |
          rm -f \
            Sonic-Mania-Decompilation/dependencies/RSDKv5 \
            || true

          rm -f \
            android/app/jni/Game \
            || true

          rm -f \
            android/app/jni/MTC \
            || true

          rm -f \
            android/app/jni/UWM \
            || true


      # ----------------------------------------------------------
      # Upload Android APKs
      # ----------------------------------------------------------

      - name: Upload Android artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-android
          path: android-artifacts
          if-no-files-found: warn
