name: Build RSDKv5 + U

on:
  workflow_dispatch:

jobs:

  # ============================================================
  # WINDOWS 32-BIT
  # ============================================================
  v5-windows:
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            pkg-config
            make
            git
            mingw-w64-i686-gcc
            mingw-w64-i686-SDL2
            mingw-w64-i686-libogg
            mingw-w64-i686-libtheora

      - name: Build RSDKv5
        run: |
          make -j8 RSDK_ONLY=1 AUTOBUILD=1

      - name: Build RSDKv5U
        run: |
          make -j8 clean-rsdk
          make -j8 RSDK_ONLY=1 RSDK_REVISION=3 AUTOBUILD=1

      - name: Move artifacts
        run: |
          mkdir -p artifacts
          cp ./bin/Windows/DX9/*.exe ./artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v5-windows
          path: artifacts


  # ============================================================
  # WINDOWS 64-BIT
  # ============================================================
  v5-windows-x64:
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            pkg-config
            make
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-libtheora

      - name: Build RSDKv5
        run: |
          make -j8 RSDK_ONLY=1 AUTOBUILD=1

      - name: Build RSDKv5U
        run: |
          make -j8 clean-rsdk
          make -j8 RSDK_ONLY=1 RSDK_REVISION=3 AUTOBUILD=1

      - name: Move artifacts
        run: |
          mkdir -p artifacts
          cp ./bin/Windows/DX9/*.exe ./artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v5-windows-x64
          path: artifacts


  # ============================================================
  # LINUX
  # ============================================================
  v5-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            git \
            libogg-dev \
            libsdl2-dev \
            libtheora-dev \
            libglew-dev \
            libglfw3-dev

      # --------------------------------------------------------
      # OpenGL RSDKv5
      # --------------------------------------------------------
      - name: Build RSDKv5 OpenGL
        run: |
          make -j$(nproc) RSDK_ONLY=1 AUTOBUILD=1

      - name: Build RSDKv5U OpenGL
        run: |
          make -j$(nproc) clean-rsdk
          make -j$(nproc) RSDK_ONLY=1 RSDK_REVISION=3 AUTOBUILD=1

      # --------------------------------------------------------
      # SDL2 RSDKv5
      # --------------------------------------------------------
      - name: Build RSDKv5 SDL2
        run: |
          make -j$(nproc) RSDK_ONLY=1 SUBSYSTEM=SDL2 AUTOBUILD=1

      - name: Build RSDKv5U SDL2
        run: |
          make -j$(nproc) clean-rsdk
          make -j$(nproc) RSDK_ONLY=1 SUBSYSTEM=SDL2 RSDK_REVISION=3 AUTOBUILD=1

      # Preserve Linux executable permissions.
      - name: Package Linux artifacts
        run: |
          mkdir -p artifacts

          find bin/Linux -type f -executable -exec cp {} artifacts/ \;

          tar -czvf rsdkv5-linux.tar.gz -C artifacts .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v5-linux
          path: rsdkv5-linux.tar.gz


  # ============================================================
  # ANDROID
  # ============================================================
  v5-android:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # RSDKv5 repository
      # --------------------------------------------------------
      - name: Checkout RSDKv5
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # --------------------------------------------------------
      # Sonic Mania Decompilation
      # --------------------------------------------------------
      - name: Checkout Sonic Mania
        uses: actions/checkout@v4
        with:
          repository: RSDKModding/Sonic-Mania-Decompilation
          path: Sonic-Mania-Decompilation

      # --------------------------------------------------------
      # Example Mods
      # --------------------------------------------------------
      - name: Checkout Example Mods
        uses: actions/checkout@v4
        with:
          repository: RSDKModding/RSDKv5-Example-Mods
          path: RSDKv5-Example-Mods

      # --------------------------------------------------------
      # GameAPI
      # --------------------------------------------------------
      - name: Checkout GameAPI
        uses: actions/checkout@v4
        with:
          repository: RSDKModding/RSDKv5-GameAPI
          path: RSDKv5-GameAPI

      # --------------------------------------------------------
      # Android dependencies
      # --------------------------------------------------------
      - name: Setup RSDKv5 Android dependencies
        working-directory: ./dependencies/android
        run: |
          curl -L -O https://downloads.xiph.org/releases/ogg/libogg-1.3.5.zip
          curl -L -O https://downloads.xiph.org/releases/theora/libtheora-1.1.1.zip

          unzip '*.zip'

          rm -f *.zip

          rsync -ar libogg-*/* libogg/
          mv libtheora-* libtheora

      # --------------------------------------------------------
      # Android symlinks
      # --------------------------------------------------------
      - name: Setup Android RSDKv5 symlinks
        run: |
          rm -rf Game

          rm -rf Sonic-Mania-Decompilation/dependencies/RSDKv5

          ln -s "$PWD" \
            Sonic-Mania-Decompilation/dependencies/RSDKv5

          ln -s "$PWD/RSDKv5-GameAPI" \
            RSDKv5-Example-Mods/ManiaTouchControls/GameAPI

          ln -s "$PWD/RSDKv5-GameAPI" \
            RSDKv5-Example-Mods/UltrawideMania/GameAPI

          ln -s "$PWD/Sonic-Mania-Decompilation" \
            android/app/jni/Game

          ln -s "$PWD/RSDKv5-Example-Mods/ManiaTouchControls" \
            android/app/jni/MTC

          ln -s "$PWD/RSDKv5-Example-Mods/UltrawideMania" \
            android/app/jni/UWM

      # --------------------------------------------------------
      # Java
      # --------------------------------------------------------
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      # --------------------------------------------------------
      # Android SDK
      # --------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------------
      # Build RSDKv5U Android
      # --------------------------------------------------------
      - name: Build RSDKv5U Android
        working-directory: ./android
        run: |
          ./gradlew assemble \
            --no-daemon \
            -PABIFILTERS="armeabi-v7a;arm64-v8a" \
            -PRETRO_DISABLE_PLUS \
            -PRETRO_REVISION=3

          mv app/build/outputs/apk/release/*.apk \
            rsdkv5u_mania.apk

      # --------------------------------------------------------
      # Build RSDKv5 Android
      # --------------------------------------------------------
      - name: Build RSDKv5 Android
        working-directory: ./android
        run: |
          ./gradlew clean --no-daemon

          ./gradlew assemble \
            --no-daemon \
            -PABIFILTERS="armeabi-v7a;arm64-v8a" \
            -PRETRO_DISABLE_PLUS \
            -PRETRO_REVISION=2

          mv app/build/outputs/apk/release/*.apk \
            rsdkv5_mania.apk

      # --------------------------------------------------------
      # Bundle Android artifacts
      # --------------------------------------------------------
      - name: Bundle Android artifacts
        run: |
          mkdir -p artifacts/mods

          cp android/*.apk artifacts/

          # Mania Touch Controls
          if [ -d android/app/jni/MTC/build ]; then
            mkdir -p artifacts/mods/MTC
            cp -r android/app/jni/MTC/build/* artifacts/mods/MTC/
          fi

          # Ultrawide Mania
          if [ -d android/app/jni/UWM/build ]; then
            mkdir -p artifacts/mods/UWM
            cp -r android/app/jni/UWM/build/* artifacts/mods/UWM/
          fi

          # OpenGL shaders
          mkdir -p artifacts/mods/GLShaders/Data/Shaders

          if [ -d RSDKv5/Shaders/OGL ]; then
            cp -r RSDKv5/Shaders/OGL/* \
              artifacts/mods/GLShaders/Data/Shaders/
          fi

          # GLShaders mod.ini
          printf '%s\n' \
            'Name=GLShaders' \
            'Description=OGLShaders' \
            'Author=Ducky' \
            'Version=1.0.0' \
            'TargetVersion=-1' \
            > artifacts/mods/GLShaders/mod.ini

          # Mod configuration
          printf '%s\n' \
            '[Mods]' \
            'MTC=y' \
            'UWM=y' \
            'GLShaders=y' \
            > artifacts/mods/modconfig.ini

      # --------------------------------------------------------
      # Remove symlink before checkout cleanup
      # --------------------------------------------------------
      - name: Cleanup
        if: always()
        run: |
          rm -f Sonic-Mania-Decompilation/dependencies/RSDKv5

      # --------------------------------------------------------
      # Upload Android
      # --------------------------------------------------------
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v5-android
          path: artifacts
